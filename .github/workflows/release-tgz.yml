name: Release tgz

# Runs when a version tag like v0.2.5 is pushed
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # needed to create the GitHub release and upload the asset

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm install

      # Fail early if the git tag does not match the version in package.json
      - name: Check tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION=${GITHUB_REF_NAME#v}
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      # npm pack bundles only what "files" lists (lib/) plus package.json,
      # under a package/ root folder, which is what npm install expects.
      - name: Pack tgz
        run: npm pack

      - name: Create GitHub release and upload tgz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TGZ=$(ls *.tgz)
          gh release create "$GITHUB_REF_NAME" "$TGZ" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
